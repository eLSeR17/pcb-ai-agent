[project]
name = "pcb-ai-agent"
version = "0.1.0"
description = "Local AI agent for KiCad PCB designs — S-expression/netlist parsers, evidence-based board audit and deterministic firmware templates (STM32 HAL / Arduino)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eLSeR17" }]
keywords = ["kicad", "pcb", "eda", "netlist", "schematic", "hardware", "embedded", "mcp", "local-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/eLSeR17/pcb-ai-agent"
Repository = "https://github.com/eLSeR17/pcb-ai-agent"
Issues = "https://github.com/eLSeR17/pcb-ai-agent/issues"

[project.optional-dependencies]
# PYSEC-2026-1845 fixed bounds (same resolution as plc-ai-agent): pytest >= 9.0.3,
# pytest-asyncio >= 1.4.
dev = ["pytest>=9.0.3,<10.0", "pytest-asyncio>=1.4,<2.0", "ruff>=0.5,<1.0"]
# Optional MCP server dependency (same bound as plc-ai-agent's requirements.txt).
# Not part of `dev` on purpose: the pure tool functions and their tests run
# without the SDK, which is imported lazily by pcbai.mcp.server.
mcp = ["mcp>=2.0,<3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: integration test against a real local Ollama server (skipped by default; set PCB_AGENT_RUN_LLM=1)",
    "slow: slow integration test (skipped by default; set PCB_AGENT_RUN_LLM=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length enforced by ruff format, not lint
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools.package-data]
# The compile-check (pcbai.firmware.compile_check) ships minimal HAL/Arduino
# stub headers; without this they would be dropped from built wheels.
"pcbai.firmware.stubs" = ["*.h"]